name: Crea NexusDesk EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compila helper nativo NexusInput (evita blocchi antivirus)
        run: |
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /out:NexusInput.exe /r:System.Windows.Forms.dll NexusInput.cs

      - name: Installa Electron e dipendenze
        run: npm install

      - name: Genera NexusDesk Setup e Portable EXE
        run: npm run build

      - name: Carica i file EXE pronti per il download
        uses: actions/upload-artifact@v4
        with:
          name: NexusDesk-Windows-Executable
          path: dist/*.exe
