<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusDesk P2P - Remote Desktop</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      body { background-color: #1e1e1e; margin: 0; padding: 0; color: white; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
      .no-select { user-select: none; -webkit-user-select: none; }
      ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React;

      const isNativeApp = !!(window.nexusNative && window.nexusNative.isDesktopApp);

      const Icons = {
        Monitor: ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>,
        Copy: ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>,
        Check: ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>,
        Play: ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"/></svg>,
        X: ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
        MousePointer2: ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m14 14 3.12 3.12a.9.9 0 0 1-.64 1.53l-3.3.43-1.92 2.86A.9.9 0 0 1 10 21.4V2L22 13.5a.9.9 0 0 1-.5 1.62l-3.6.43-3.4 3.4z"/></svg>,
        LinkIcon: ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>,
        Maximize: ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      };
      const { Monitor, Copy, Check, Play, X, MousePointer2, LinkIcon, Maximize } = Icons;
      
      function App() {
        const [myId, setMyId] = useState('');
        const [peerReady, setPeerReady] = useState(false);
        const [statusMsg, setStatusMsg] = useState('Connessione server P2P...');
        const [remoteId, setRemoteId] = useState('');
        const [sessionState, setSessionState] = useState('idle'); 
        const [remoteStream, setRemoteStream] = useState(null);
        const [incomingRequest, setIncomingRequest] = useState(null);
        const [copied, setCopied] = useState(false);
        const [linkCopied, setLinkCopied] = useState(false);
        const [connectedPeerId, setConnectedPeerId] = useState('');
        
        const [isFullscreen, setIsFullscreen] = useState(false);
        const [controlMode, setControlMode] = useState(true);
        const [remoteCursor, setRemoteCursor] = useState(null);

        const peerRef = useRef(null);
        const dataConnRef = useRef(null);
        const mediaCallRef = useRef(null);
        const localStreamRef = useRef(null);
        const videoRef = useRef(null);
        const fullscreenContainerRef = useRef(null);
        const connectTimeoutRef = useRef(null);
        const lastMoveRef = useRef(0);

        const generateNewId = () => Math.floor(100000000 + Math.random() * 900000000).toString();

        const captureScreenStream = async () => {
          if (isNativeApp) {
            const sourceId = await window.nexusNative.getPrimaryScreenId();
            if (sourceId) {
              return await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                  mandatory: { chromeMediaSource: 'desktop', chromeMediaSourceId: sourceId, maxWidth: 1920, maxHeight: 1080, maxFrameRate: 30 }
                }
              });
            }
          }
          return await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always", displaySurface: "monitor" }, audio: false });
        };

        const initPeer = (forcedId = null) => {
          if (peerRef.current) { try { peerRef.current.destroy(); } catch (e) {} }
          setPeerReady(false);
          setStatusMsg('Allineamento...');

          const storedId = forcedId || localStorage.getItem('nexus_id') || generateNewId();
          localStorage.setItem('nexus_id', storedId);
          setMyId(storedId);

          const peer = new Peer(storedId, {
            config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] }
          });

          peerRef.current = peer;

          peer.on('open', (id) => { setMyId(id); setPeerReady(true); setStatusMsg('Pronto e Online'); });
          peer.on('disconnected', () => { setPeerReady(false); setStatusMsg('Riconnessione...'); try { peer.reconnect(); } catch (e) {} });
          peer.on('error', (err) => {
            if (connectTimeoutRef.current) clearTimeout(connectTimeoutRef.current);
            if (err.type === 'unavailable-id') { initPeer(generateNewId()); return; }
            if (err.type === 'peer-unavailable') { alert("Il dispositivo remoto non è online."); setSessionState('idle'); }
          });
          peer.on('connection', (conn) => { setupDataConnection(conn); });
          peer.on('call', (call) => {
            if (connectTimeoutRef.current) clearTimeout(connectTimeoutRef.current);
            mediaCallRef.current = call;
            setConnectedPeerId(call.peer);
            call.answer();
            call.on('stream', (stream) => { setRemoteStream(stream); setSessionState('connected'); });
            call.on('close', () => endSession());
          });
        };

        const setupDataConnection = (conn) => {
          dataConnRef.current = conn;
          conn.on('data', (data) => {
            if (!data) return;
            if (data.type === 'request-control') {
              setIncomingRequest({ callerId: data.from, connection: conn });
            } else if (data.type === 'rejected') {
              if (connectTimeoutRef.current) clearTimeout(connectTimeoutRef.current);
              alert("Connessione rifiutata dall'ospite.");
              endSession();
            } else if (data.type === 'remote-input') {
              if (isNativeApp) {
                window.nexusNative.sendNativeInput(data);
              } else if (data.action === 'click') {
                setRemoteCursor({ x: data.x, y: data.y });
                setTimeout(() => setRemoteCursor(null), 1000);
              }
            } else if (data.type === 'end-session') { endSession(); }
          });
        };

        useEffect(() => {
          const urlParams = new URLSearchParams(window.location.search);
          const inviteId = urlParams.get('id');
          if (inviteId) setRemoteId(inviteId.replace(/\D/g, ''));
          initPeer();
          
          const handleFullscreenChange = () => { setIsFullscreen(!!document.fullscreenElement); };
          document.addEventListener('fullscreenchange', handleFullscreenChange);
          return () => { document.removeEventListener('fullscreenchange', handleFullscreenChange); if (peerRef.current) peerRef.current.destroy(); };
        }, []);

        useEffect(() => {
          if (videoRef.current && remoteStream) {
            videoRef.current.srcObject = remoteStream;
            videoRef.current.play().catch(() => { if (videoRef.current) { videoRef.current.muted = true; videoRef.current.play(); } });
          }
        }, [remoteStream, sessionState]);

        const copyId = () => { navigator.clipboard.writeText(myId); setCopied(true); setTimeout(() => setCopied(false), 2000); };
        const copyInviteLink = () => {
          const baseUrl = window.location.href.startsWith('file://') ? 'https://fsc1926-rgb.github.io/NexusDesk/' : window.location.href.split('?')[0];
          navigator.clipboard.writeText(`${baseUrl}?id=${myId}`);
          setLinkCopied(true); setTimeout(() => setLinkCopied(false), 2000);
        };

        const startConnection = () => {
          const cleanRemoteId = remoteId.replace(/\D/g, '');
          if (!cleanRemoteId || !peerRef.current) return;
          if (peerRef.current.disconnected) peerRef.current.reconnect();
          
          setConnectedPeerId(cleanRemoteId);
          setSessionState('connecting');

          const conn = peerRef.current.connect(cleanRemoteId, { reliable: true });
          setupDataConnection(conn);

          if (connectTimeoutRef.current) clearTimeout(connectTimeoutRef.current);
          connectTimeoutRef.current = setTimeout(() => { setSessionState(curr => curr === 'connecting' ? 'idle' : curr); }, 35000);

          conn.on('open', () => { conn.send({ type: 'request-control', from: myId }); });
        };

        const acceptRequest = async () => {
          const req = incomingRequest;
          if (!req || !peerRef.current) return;
          try {
            const stream = await captureScreenStream();
            localStreamRef.current = stream;
            setConnectedPeerId(req.callerId);
            dataConnRef.current = req.connection;
            const call = peerRef.current.call(req.callerId, stream);
            mediaCallRef.current = call;
            setSessionState('sharing');
            setIncomingRequest(null);
            stream.getVideoTracks()[0].onended = () => endSession();
          } catch (err) {
            alert("Condivisione schermo annullata: " + err.message);
            if (req.connection && req.connection.open) req.connection.send({ type: 'rejected' });
            setIncomingRequest(null);
          }
        };

        const shareMyScreenDirectly = async () => {
          const cleanId = remoteId.replace(/\D/g, '');
          if (!cleanId || !peerRef.current) return;
          try {
            const stream = await captureScreenStream();
            localStreamRef.current = stream;
            setConnectedPeerId(cleanId);
            const conn = peerRef.current.connect(cleanId, { reliable: true });
            setupDataConnection(conn);
            const call = peerRef.current.call(cleanId, stream);
            mediaCallRef.current = call;
            setSessionState('sharing');
            stream.getVideoTracks()[0].onended = () => endSession();
          } catch (e) {}
        };

        const rejectRequest = () => {
          if (incomingRequest?.connection?.open) incomingRequest.connection.send({ type: 'rejected' });
          setIncomingRequest(null);
        };

        const endSession = () => {
          if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
          if (dataConnRef.current?.open) { try { dataConnRef.current.send({ type: 'end-session' }); } catch(e){} }
          if (mediaCallRef.current) mediaCallRef.current.close();
          if (localStreamRef.current) localStreamRef.current.getTracks().forEach(t => t.stop());
          if (remoteStream) remoteStream.getTracks().forEach(t => t.stop());
          
          setIsFullscreen(false);
          setSessionState('idle');
          setIncomingRequest(null);
        };

        const toggleFullscreen = () => {
          if (!fullscreenContainerRef.current) return;
          if (!document.fullscreenElement) { fullscreenContainerRef.current.requestFullscreen().catch(() => {}); } 
          else { document.exitFullscreen(); }
        };

        const getPreciseCoordinates = (e) => {
          const video = videoRef.current;
          if (!video) return null;

          const rect = video.getBoundingClientRect();
          const vw = video.videoWidth;
          const vh = video.videoHeight;
          if (!vw || !vh) return null;

          const cw = rect.width;
          const ch = rect.height;

          const scale = Math.min(cw / vw, ch / vh);
          const displayW = vw * scale;
          const displayH = vh * scale;

          const offsetX = (cw - displayW) / 2;
          const offsetY = (ch - displayH) / 2;

          const clickX = e.clientX - rect.left;
          const clickY = e.clientY - rect.top;

          if (clickX < offsetX || clickX > offsetX + displayW || clickY < offsetY || clickY > offsetY + displayH) return null;

          const x = Math.max(0, Math.min(1, (clickX - offsetX) / displayW));
          const y = Math.max(0, Math.min(1, (clickY - offsetY) / displayH));

          return { x, y };
        };

        const sendInput = useCallback((action, e) => {
          if (!controlMode || !dataConnRef.current || !dataConnRef.current.open || sessionState !== 'connected') return;
          
          if (action === 'keydown') {
             dataConnRef.current.send({ type: 'remote-input', action: 'keydown', key: e.key });
             return;
          }

          if (action === 'move') {
            const now = Date.now();
            // FIX: Limite più alto (45ms) per evitare l'ingorgo di rete che faceva muovere il mouse da solo
            if (now - lastMoveRef.current < 45) return;
            lastMoveRef.current = now;
          }

          const coords = getPreciseCoordinates(e);
          if (coords) {
            dataConnRef.current.send({ type: 'remote-input', action, x: coords.x, y: coords.y });
          }
        }, [controlMode, sessionState]);

        const canConnect = peerReady && remoteId.replace(/\D/g, '').length >= 6 && remoteId.replace(/\D/g, '') !== myId;

        if (sessionState === 'connected' || sessionState === 'connecting') {
          return (
            <div className="flex flex-col h-screen bg-[#111111] text-white font-sans no-select outline-none" tabIndex="0" onKeyDown={(e) => sendInput('keydown', e)}>
              {!isFullscreen && (
                <div className="bg-[#1e1e1e] border-b border-gray-800 flex items-center justify-between px-4 py-2">
                  <div className="flex items-center space-x-2 bg-[#2d2d2d] px-4 py-1.5 rounded-t-lg border-t-2 border-blue-500">
                    <Monitor size={16} className="text-blue-400" />
                    <span className="font-semibold text-sm">Controllo Remoto: {connectedPeerId}</span>
                    <button onClick={endSession} className="ml-4 hover:bg-red-500 rounded-full p-1 transition-colors"><X size={14} /></button>
                  </div>
                  <div className="flex items-center space-x-3">
                    <button onClick={() => setControlMode(!controlMode)} className={`px-3 py-1 rounded text-xs font-bold flex items-center ${controlMode ? 'bg-green-600 text-white' : 'bg-gray-700 text-gray-300'}`}>
                      <MousePointer2 size={14} className="mr-1.5" /> {controlMode ? 'Controllo ATTIVO' : 'Solo Visuale'}
                    </button>
                    <button onClick={toggleFullscreen} className="px-3 py-1 bg-gray-800 hover:bg-gray-700 rounded text-xs flex items-center"><Maximize size={14} className="mr-1.5" /> Schermo Intero</button>
                  </div>
                </div>
              )}

              <div ref={fullscreenContainerRef} className="flex-1 relative flex items-center justify-center bg-black overflow-hidden">
                {sessionState === 'connecting' ? (
                  <div className="flex flex-col items-center text-center">
                    <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-blue-500 mb-4"></div>
                    <p className="text-gray-300">In attesa che l'ospite accetti...</p>
                    <button onClick={endSession} className="mt-4 px-4 py-2 bg-gray-800 rounded">Annulla</button>
                  </div>
                ) : (
                  <video
                    ref={videoRef}
                    autoPlay
                    playsInline
                    muted
                    onMouseMove={(e) => sendInput('move', e)}
                    onClick={(e) => sendInput('click', e)}
                    onDoubleClick={(e) => sendInput('dblclick', e)}
                    onContextMenu={(e) => { e.preventDefault(); sendInput('rightclick', e); }}
                    className={`w-full h-full object-contain ${controlMode ? 'cursor-crosshair' : 'cursor-default'}`}
                  />
                )}
              </div>
            </div>
          );
        }

        if (sessionState === 'sharing') {
          return (
            <div className="flex flex-col h-screen bg-[#111111] text-white items-center justify-center no-select px-4 text-center">
              <Monitor size={64} className="text-green-500 mb-6 animate-pulse" />
              <h2 className="text-2xl font-bold mb-2">Sessione Remota Attiva</h2>
              <p className="text-gray-400 mb-6">L'operatore <strong className="text-white">{connectedPeerId}</strong> è collegato al tuo computer.</p>
              
              <div className="bg-[#1e1e1e] p-4 rounded-lg border border-gray-700 text-xs text-gray-300 mb-8 max-w-md">
                 {isNativeApp ? "✅ Controllo Nativo Attivo. Puoi ridurre a icona questa finestra." : "⚠️ Modalità Web: Scarica e apri il file .exe per abilitare il controllo totale del mouse."}
              </div>

              <button onClick={endSession} className="px-6 py-3 bg-red-600 hover:bg-red-500 font-bold rounded-lg flex items-center transition-colors">
                <X size={18} className="mr-2" /> Interrompi Sessione
              </button>
              
              {!isNativeApp && remoteCursor && (
                <div className="fixed pointer-events-none z-50 w-8 h-8 border-4 border-red-500 bg-red-500/40 rounded-full shadow-[0_0_20px_red] animate-ping" style={{ left: `${remoteCursor.x * 100}vw`, top: `${remoteCursor.y * 100}vh`, transform: 'translate(-50%, -50%)' }} />
              )}
            </div>
          );
        }

        return (
          <div className="flex flex-col h-screen bg-[#1e1e1e] text-white font-sans overflow-hidden no-select">
            <div className="bg-[#181818] border-b border-black flex items-center justify-between px-3 py-1.5">
              <div className="flex items-center space-x-2 bg-[#2d2d2d] px-4 py-1.5 rounded-t-md border-t-2 border-blue-500 text-sm">
                <Monitor size={16} className="text-blue-400" />
                <span className="font-semibold">NexusDesk {isNativeApp ? 'Desktop Pro' : 'Web P2P'}</span>
              </div>
              <div className="flex items-center space-x-3 text-xs">
                <span className="flex items-center text-gray-300">
                  <span className={`w-2.5 h-2.5 rounded-full mr-2 ${peerReady ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 'bg-yellow-500 animate-pulse'}`}></span>
                  {statusMsg}
                </span>
              </div>
            </div>
            
            <div className="flex flex-col md:flex-row flex-1 overflow-y-auto">
              <div className="w-full md:w-1/2 p-8 md:p-10 bg-[#252525] flex flex-col shadow-2xl border-r border-[#111]">
                <h2 className="text-xl font-bold text-gray-200 mb-6">Questo Dispositivo</h2>
                <div className="bg-[#1e1e1e] p-6 rounded-lg border border-gray-700 shadow-inner">
                  <div className="mb-5">
                    <label className="text-xs text-gray-400 uppercase font-bold mb-2 block">Il tuo ID</label>
                    <div className="flex items-center justify-between bg-black p-4 rounded text-3xl font-mono text-blue-400 border border-gray-800">
                      <span>{myId ? `${myId.slice(0,3)} ${myId.slice(3,6)} ${myId.slice(6,9)}` : '...'}</span>
                      <button onClick={copyId} className="text-gray-400 hover:text-white p-2">{copied ? <Check size={24} className="text-green-500" /> : <Copy size={24} />}</button>
                    </div>
                  </div>
                  <div className="mb-6">
                    <button onClick={copyInviteLink} className="w-full py-2.5 px-4 bg-[#2a2a2a] hover:bg-[#333] border border-gray-600 rounded flex justify-center text-sm font-semibold text-blue-400">
                      {linkCopied ? <Check size={16} className="mr-2 text-green-500" /> : <LinkIcon size={16} className="mr-2" />}
                      {linkCopied ? 'Copiato!' : 'Copia Link di Invito'}
                    </button>
                  </div>
                  <div>
                    <label className="text-xs text-gray-400 uppercase font-bold mb-1 block">Modalità Sistema</label>
                    <div className={`text-xs font-semibold ${isNativeApp ? 'text-green-400' : 'text-yellow-400'}`}>
                      {isNativeApp ? '✔ Controllo Hardware Nativo Abilitato' : 'Browser Web (Controllo passivo)'}
                    </div>
                  </div>
                </div>
              </div>
              
              <div className="w-full md:w-1/2 p-8 md:p-10 bg-[#1e1e1e] flex flex-col">
                <h2 className="text-xl font-bold text-gray-200 mb-6">Controlla Dispositivo Remoto</h2>
                <div className="bg-[#2d2d2d] p-6 rounded-lg border border-gray-700">
                  <label className="text-xs text-gray-400 uppercase font-bold mb-2 block">Inserisci ID partner</label>
                  <div className="flex flex-col sm:flex-row gap-3">
                    <input type="text" value={remoteId} onChange={(e) => setRemoteId(e.target.value.replace(/[^\d\s]/g, ''))} placeholder="Es. 123 456 789" className="flex-1 bg-black text-white text-2xl font-mono p-4 rounded border border-gray-600 focus:outline-none" />
                    <button onClick={startConnection} disabled={!canConnect} className="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-700 text-white font-bold px-6 py-4 rounded flex items-center shadow-lg"><Play size={20} className="mr-2" /> Connetti</button>
                  </div>
                  {canConnect && (
                    <div className="mt-4 pt-4 border-t border-gray-700 flex justify-between items-center">
                      <span className="text-xs text-gray-400">Opzione invio rapido:</span>
                      <button onClick={shareMyScreenDirectly} className="text-xs bg-green-700 hover:bg-green-600 text-white px-3 py-2 rounded font-semibold">Condividi il mio schermo</button>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {incomingRequest && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                <div className="bg-[#252525] p-6 rounded-lg border border-gray-700 max-w-sm w-full shadow-2xl text-center">
                  <div className="bg-blue-500/20 p-4 rounded-full text-blue-400 inline-block mb-4"><Monitor size={32} /></div>
                  <h3 className="text-xl font-bold mb-2">Richiesta di Controllo Remoto</h3>
                  <p className="text-gray-300 text-sm mb-6">L'ID <strong className="text-white font-mono">{incomingRequest.callerId}</strong> chiede di visualizzare e controllare il tuo schermo.</p>
                  <div className="flex space-x-3">
                    <button onClick={rejectRequest} className="flex-1 bg-gray-700 py-3 rounded font-bold">Rifiuta</button>
                    <button onClick={acceptRequest} className="flex-1 bg-green-600 py-3 rounded font-bold flex justify-center"><Check size={18} className="mr-2" /> Accetta</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      class ErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { hasError: false, error: null }; }
        static getDerivedStateFromError(error) { return { hasError: true, error }; }
        render() {
          if (this.state.hasError) return (<div style={{padding: '40px', color: '#ff6b6b', backgroundColor: '#1e1e1e', height: '100vh', fontFamily: 'monospace'}}><h2>Errore</h2><pre>{this.state.error.toString()}</pre><button onClick={() => window.location.reload()}>Riavvia</button></div>);
          return this.props.children;
        }
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
    <script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{})); }</script>
</body>
</html>
