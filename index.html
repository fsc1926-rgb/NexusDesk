<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusDesk P2P - Controllo Remoto & Condivisione Schermo</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <meta name="theme-color" content="#2563eb" />
  <script src="https://cdn.tailwindcss.com"><\/script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #1e1e1e; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const INITIAL_DEVICES = [
      { id: '192.168.1.104', alias: 'Workstation-Studio', os: 'Windows 11', status: 'online', ping: 2, netType: 'LAN' },
      { id: '87.14.210.99', alias: 'PC-Affiliato-Milano', os: 'Windows 11', status: 'online', ping: 24, netType: 'WAN_P2P' },
      { id: '151.48.92.14', alias: 'MacBook-Affiliato', os: 'macOS', status: 'online', ping: 38, netType: 'WAN_P2P' },
      { id: '192.168.1.250', alias: 'Server-Locale-NAS', os: 'Ubuntu', status: 'online', ping: 1, netType: 'LAN' },
      { id: '93.41.118.202', alias: 'Postazione-Napoli', os: 'Windows 10', status: 'offline', ping: null, netType: 'WAN_P2P' }
    ];

    const INITIAL_FILES = [
      { name: 'Presentazione_Piattaforma_2026.pdf', size: '4.2 MB', dir: 'Locale' },
      { name: 'Guida_Onboarding_Affiliati.docx', size: '1.8 MB', dir: 'Locale' },
      { name: 'Configurazione_Nodo_P2P.json', size: '14 KB', dir: 'Remoto' }
    ];

    function App() {
      const [currentTab, setCurrentTab] = useState('home'); 
      const [myId] = useState('849 201 442');
      const [tempPass, setTempPass] = useState('k9#mP2$vL');
      const [showPass, setShowPass] = useState(false);
      const [inviteToken, setInviteToken] = useState('NX-994A-77B2-WIFI');
      const [remoteInput, setRemoteInput] = useState('');
      const [isConnecting, setIsConnecting] = useState(false);
      const [devices, setDevices] = useState(INITIAL_DEVICES);
      
      const [activeSession, setActiveSession] = useState(null); 
      const [webrtcMode, setWebrtcMode] = useState(false);
      const [webrtcRole, setWebrtcRole] = useState(null); 
      const [realOfferToken, setRealOfferToken] = useState('');
      const [realAnswerToken, setRealAnswerToken] = useState('');
      const [isRealConnected, setIsRealConnected] = useState(false);
      const [isWhiteboardMode, setIsWhiteboardMode] = useState(false);
      const [sidePanel, setSidePanel] = useState(null);
      const [selectedMonitor, setSelectedMonitor] = useState(1);

      const [chatMessages, setChatMessages] = useState([
        { sender: 'Sistema', text: 'Canale crittografato End-to-End pronto.', time: 'Ora' }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [files, setFiles] = useState(INITIAL_FILES);
      const [stunServer, setStunServer] = useState('stun:stun.l.google.com:19302');

      const peerConnectionRef = useRef(null);
      const dataChannelRef = useRef(null);
      const remoteVideoRef = useRef(null);
      const localStreamRef = useRef(null);
      const canvasRef = useRef(null);
      const isDrawingRef = useRef(false);
      const [toast, setToast] = useState(null);

      const triggerToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      useEffect(() => {
        const hash = window.location.hash;
        if (hash && hash.startsWith('#join=')) {
          const tokenFromUrl = decodeURIComponent(hash.replace('#join=', ''));
          setRemoteInput(tokenFromUrl);
          triggerToast('Link invito rilevato! Clicca su Connetti.', 'info');
        }
      }, []);

      const startDraw = (e) => {
        if (!isWhiteboardMode || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const ctx = canvas.getContext('2d');
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        isDrawingRef.current = true;
      };

      const draw = (e) => {
        if (!isDrawingRef.current || !isWhiteboardMode || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const ctx = canvas.getContext('2d');
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
      };

      const stopDraw = () => { isDrawingRef.current = false; };

      const clearWhiteboard = () => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');
        ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
        triggerToast('Lavagna pulita', 'info');
      };

      const regeneratePassword = () => {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*';
        let pass = '';
        for (let i = 0; i < 9; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
        setTempPass(pass);
        triggerToast('Nuova password generata', 'success');
      };

      const regenerateInvite = () => {
        const rand = Math.random().toString(36).substring(2, 6).toUpperCase() + '-' + Math.random().toString(36).substring(2, 6).toUpperCase();
        setInviteToken('NX-' + rand + '-P2P');
        triggerToast('Nuovo Link Multi-Wi-Fi generato', 'success');
      };

      const copyToClipboard = (text, msg) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        document.execCommand('copy');
        textArea.remove();
        triggerToast(msg, 'success');
      };

      const setupDataChannel = (channel) => {
        channel.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'chat') {
              setChatMessages(prev => [...prev, { sender: 'Affiliato', text: data.text, time: 'Ora' }]);
            }
          } catch (e) {}
        };
      };

      const sendChatMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;
        const msgText = chatInput.trim();
        setChatMessages(prev => [...prev, { sender: 'Tu', text: msgText, time: 'Ora' }]);
        if (dataChannelRef.current && dataChannelRef.current.readyState === 'open') {
          dataChannelRef.current.send(JSON.stringify({ type: 'chat', text: msgText }));
        } else if (!webrtcMode) {
          setTimeout(() => {
            setChatMessages(prev => [...prev, { sender: activeSession?.alias || 'Remoto', text: 'Perfetto, vedo lo schermo condiviso!', time: 'Ora' }]);
          }, 800);
        }
        setChatInput('');
      };

      const startConnection = (target) => {
        const raw = (typeof target === 'string' ? target : target.id).trim();
        if (!raw) return triggerToast('Inserisci un ID o Token WebRTC', 'warning');
        if (raw.length > 45) return joinRealSession(raw);

        setIsConnecting(true);
        setTimeout(() => {
          setIsConnecting(false);
          const found = devices.find(d => d.id === raw);
          const deviceObj = found || {
            id: raw, alias: 'Affiliato (' + raw + ')', os: 'Remoto', status: 'online', ping: 19, netType: 'WAN_P2P'
          };
          if (!found) setDevices(prev => [deviceObj, ...prev]);
          setActiveSession(deviceObj);
          setWebrtcMode(false);
          setCurrentTab('session');
          triggerToast('Connesso a ' + deviceObj.alias, 'success');
        }, 800);
      };

      const startRealHosting = async () => {
        try {
          triggerToast('Seleziona lo schermo da condividere...', 'info');
          const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
          localStreamRef.current = stream;
          
          const pc = new RTCPeerConnection({ iceServers: [{ urls: stunServer }] });
          peerConnectionRef.current = pc;

          const dc = pc.createDataChannel('nexus-chat');
          dataChannelRef.current = dc;
          setupDataChannel(dc);

          stream.getTracks().forEach(track => pc.addTrack(track, stream));

          pc.onicecandidate = (e) => {
            if (e.candidate === null) {
              setRealOfferToken(btoa(JSON.stringify(pc.localDescription)));
              triggerToast('Token Generato! Copialo e invialo all\'affiliato.', 'success');
            }
          };

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          
          setWebrtcRole('host');
          setWebrtcMode(true);
          setCurrentTab('session');
        } catch (err) {
          triggerToast('Condivisione schermo annullata.', 'error');
        }
      };

      const joinRealSession = async (tokenStr) => {
        try {
          const offer = JSON.parse(atob(tokenStr.trim()));
          const pc = new RTCPeerConnection({ iceServers: [{ urls: stunServer }] });
          peerConnectionRef.current = pc;

          pc.ondatachannel = (event) => {
            dataChannelRef.current = event.channel;
            setupDataChannel(event.channel);
          };

          pc.ontrack = (event) => {
            if (remoteVideoRef.current) remoteVideoRef.current.srcObject = event.streams[0];
          };

          pc.oniceconnectionstatechange = () => {
            if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
              setIsRealConnected(true);
              triggerToast('Connessione P2P Stabilita!', 'success');
            }
          };

          await pc.setRemoteDescription(offer);
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          pc.onicecandidate = (e) => {
            if (e.candidate === null) {
              setRealAnswerToken(btoa(JSON.stringify(pc.localDescription)));
              setWebrtcRole('guest');
              setWebrtcMode(true);
              setCurrentTab('session');
              triggerToast('Token di Risposta pronto! Invialo all\'Host.', 'success');
            }
          };
        } catch (err) {
          triggerToast('Token WebRTC non valido', 'error');
        }
      };

      const finalizeRealHosting = async () => {
        try {
          const answer = JSON.parse(atob(realAnswerToken.trim()));
          await peerConnectionRef.current.setRemoteDescription(answer);
          setIsRealConnected(true);
          triggerToast('Tunnel P2P Attivo!', 'success');
        } catch (err) {
          triggerToast('Token di risposta errato', 'error');
        }
      };

      const disconnectSession = () => {
        setActiveSession(null);
        if (peerConnectionRef.current) peerConnectionRef.current.close();
        if (localStreamRef.current) localStreamRef.current.getTracks().forEach(t => t.stop());
        setWebrtcMode(false);
        setIsRealConnected(false);
        setWebrtcRole(null);
        setSidePanel(null);
        setIsWhiteboardMode(false);
        setCurrentTab('home');
        triggerToast('Disconnesso', 'info');
      };

      const baseAppUrl = window.location.origin + window.location.pathname;

      return (
        <div className="h-screen w-screen bg-[#1e1e1e] text-slate-200 flex flex-col font-sans overflow-hidden select-none">
          {toast && (
            <div className="fixed bottom-6 right-6 z-[100] bg-[#2b2b2b] border border-slate-600 text-white px-4 py-3 rounded-lg shadow-2xl flex items-center gap-3 text-sm">
              <span>⚡ {toast.message}</span>
            </div>
          )}

          {/* TOP TAB BAR */}
          <div className="h-10 bg-[#141414] border-b border-[#2e2e2e] flex items-center px-2">
            <div className="flex gap-1 h-full pt-1.5">
              <button onClick={() => setCurrentTab('home')} className={'px-4 h-full flex items-center gap-2 rounded-t-md border-t border-x text-xs font-semibold ' + (currentTab === 'home' ? 'bg-[#1e1e1e] border-[#333] text-white' : 'border-transparent text-slate-400 hover:bg-[#222]')}>
                <span>🏠 NexusDesk</span>
              </button>
              {(activeSession || webrtcMode) && (
                <button onClick={() => setCurrentTab('session')} className={'px-4 h-full flex items-center gap-2 rounded-t-md border-t border-x text-xs font-semibold ' + (currentTab === 'session' ? 'bg-[#1e1e1e] border-[#333] text-white' : 'border-transparent text-slate-400 hover:bg-[#222]')}>
                  <span>🖥️ {webrtcMode ? 'Condivisione Live P2P' : activeSession?.alias}</span>
                  <span className="ml-2 hover:text-red-400" onClick={(e) => { e.stopPropagation(); disconnectSession(); }}>✕</span>
                </button>
              )}
              <button onClick={() => setCurrentTab('settings')} className={'px-4 h-full flex items-center gap-2 rounded-t-md border-t border-x text-xs font-semibold ' + (currentTab === 'settings' ? 'bg-[#1e1e1e] border-[#333] text-white' : 'border-transparent text-slate-400 hover:bg-[#222]')}>
                <span>⚙️ Impostazioni</span>
              </button>
            </div>
            <div className="ml-auto px-3 text-[11px] text-emerald-400 font-semibold">● Rete P2P Pronta</div>
          </div>

          {currentTab === 'home' && (
            <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
              <div className="w-full md:w-80 lg:w-96 bg-[#252526] border-b md:border-b-0 md:border-r border-[#333] flex flex-col p-6 overflow-y-auto">
                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">💻 Il Tuo Dispositivo</h2>
                <div className="bg-[#1b1b1c] border border-[#3a3a3a] rounded-lg p-5 mb-4">
                  <div className="text-[11px] text-slate-400 mb-1">ID NexusDesk</div>
                  <div className="flex items-center justify-between mb-4">
                    <div className="text-2xl font-bold tracking-wider text-white font-mono">{myId}</div>
                    <button onClick={() => copyToClipboard(myId, 'ID Copiato')} className="px-2 py-1 text-xs bg-[#333] hover:bg-[#444] rounded">Copia</button>
                  </div>
                  <div className="h-px bg-[#2e2e2e] w-full my-3"></div>
                  <div className="text-[11px] text-slate-400 mb-1">Password Temporanea</div>
                  <div className="flex items-center justify-between">
                    <div className="text-base font-mono text-emerald-400 font-semibold">{showPass ? tempPass : '•••••••••'}</div>
                    <div className="flex gap-1">
                      <button onClick={() => setShowPass(!showPass)} className="px-2 py-1 text-xs bg-[#333] rounded">{showPass ? 'Nascondi' : 'Mostra'}</button>
                      <button onClick={regeneratePassword} className="px-2 py-1 text-xs bg-[#333] rounded">↻</button>
                    </div>
                  </div>
                </div>

                <div className="p-4 bg-blue-950/30 border border-blue-500/30 rounded-lg mb-4">
                  <h3 className="text-xs font-bold text-blue-400 mb-1.5">🎥 Condividi il Tuo Schermo (WebRTC)</h3>
                  <p className="text-[11px] text-slate-300 mb-3">Mostra le piattaforme ai tuoi affiliati in tempo reale senza server intermedi.</p>
                  <button onClick={startRealHosting} className="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2.5 rounded shadow">
                    Avvia Condivisione Schermo
                  </button>
                </div>

                <div className="p-4 bg-[#1e1e1e] border border-[#363636] rounded-lg mt-auto">
                  <div className="flex items-center justify-between mb-1.5">
                    <h3 className="text-xs font-bold text-slate-300">🔗 Link d'Invito Multi-Wi-Fi</h3>
                    <button onClick={regenerateInvite} className="text-[10px] text-blue-400">Rigenera</button>
                  </div>
                  <div className="text-[11px] font-mono bg-[#141414] p-2 rounded text-emerald-400 truncate mb-2">{baseAppUrl}#join={inviteToken}</div>
                  <button onClick={() => copyToClipboard(baseAppUrl + '#join=' + inviteToken, 'Link Copiato!')} className="w-full bg-[#333] hover:bg-[#444] text-white text-xs font-semibold py-2 rounded">
                    Copia Link Invito
                  </button>
                </div>
              </div>

              <div className="flex-1 bg-[#1e1e1e] flex flex-col p-6 lg:p-10 overflow-y-auto">
                <div className="max-w-3xl w-full mx-auto">
                  <h1 className="text-2xl lg:text-3xl font-light text-white mb-1">Controlla un Dispositivo Remoto</h1>
                  <p className="text-xs lg:text-sm text-slate-400 mb-6">Inserisci l'ID del partner o incolla il Token WebRTC ricevuto.</p>

                  <form onSubmit={e => { e.preventDefault(); startConnection(remoteInput); }} className="flex flex-col sm:flex-row gap-2 mb-8">
                    <input value={remoteInput} onChange={e => setRemoteInput(e.target.value)} placeholder="Inserisci ID Remoto o Token WebRTC..." className="flex-1 bg-[#252526] border-2 border-[#3a3a3a] focus:border-blue-500 rounded-lg py-3.5 px-4 text-sm text-white outline-none" />
                    <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3.5 rounded-lg font-bold text-sm">Connetti →</button>
                  </form>

                  <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-4 border-b border-[#2e2e2e] pb-2">Dispositivi Affiliati & Sessioni Recenti</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {devices.map(d => (
                      <div key={d.id} onClick={() => startConnection(d.id)} className="bg-[#252526] border border-[#333] hover:border-blue-500 p-4 rounded-lg cursor-pointer transition-all">
                        <div className="font-bold text-sm text-white truncate">{d.alias}</div>
                        <div className="text-[11px] text-slate-400 font-mono mb-3">{d.id}</div>
                        <div className="flex justify-between items-center text-[11px] pt-2 border-t border-[#2e2e2e]">
                          <span className={d.status === 'online' ? 'text-emerald-400' : 'text-slate-500'}>{d.status === 'online' ? '● Online (' + d.ping + 'ms)' : '○ Offline'}</span>
                          <span className="text-blue-400 font-semibold">Connetti</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {currentTab === 'settings' && (
            <div className="flex-1 bg-[#1e1e1e] p-8 overflow-y-auto">
              <div className="max-w-xl mx-auto bg-[#252526] border border-[#333] rounded-xl p-6 space-y-4">
                <h2 className="text-lg font-bold text-white">Configurazione STUN / NAT Traversal</h2>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Server STUN Pubblico Gratuito</label>
                  <input value={stunServer} onChange={e => setStunServer(e.target.value)} className="w-full bg-[#1e1e1e] border border-[#3a3a3a] rounded p-2.5 text-sm font-mono text-emerald-400" />
                </div>
                <button onClick={() => { triggerToast('Salvato!', 'success'); setCurrentTab('home'); }} className="bg-blue-600 text-white text-xs font-bold px-4 py-2 rounded">Salva</button>
              </div>
            </div>
          )}

          {currentTab === 'session' && (activeSession || webrtcMode) && (
            <div className="flex-1 flex flex-col relative bg-[#0f1014] overflow-hidden">
              <div className="absolute top-3 left-1/2 -translate-x-1/2 z-50 flex items-center bg-[#252526]/95 border border-[#444] px-3 py-1.5 rounded-lg shadow-2xl gap-2">
                <span className="text-xs font-bold text-emerald-400 pr-2 border-r border-[#444]">● {webrtcMode ? 'WebRTC P2P' : activeSession?.alias}</span>
                <button onClick={() => setSelectedMonitor(selectedMonitor === 1 ? 2 : 1)} className="px-2 py-1 hover:bg-[#333] rounded text-xs">Display {selectedMonitor}</button>
                <button onClick={() => setIsWhiteboardMode(!isWhiteboardMode)} className={'px-2 py-1 rounded text-xs ' + (isWhiteboardMode ? 'bg-amber-600 text-white font-bold' : 'hover:bg-[#333]')}>✏️ Lavagna</button>
                {isWhiteboardMode && <button onClick={clearWhiteboard} className="px-2 py-1 bg-[#333] rounded text-xs text-amber-300">Pulisci</button>}
                <button onClick={() => setSidePanel(sidePanel === 'chat' ? null : 'chat')} className="px-2 py-1 hover:bg-[#333] rounded text-xs">💬 Chat</button>
                <button onClick={disconnectSession} className="bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded text-xs font-bold">Chiudi</button>
              </div>

              {webrtcMode ? (
                <div className="flex-1 flex items-center justify-center relative p-6">
                  {!isRealConnected && webrtcRole === 'host' && (
                    <div className="bg-[#252526] border border-[#444] p-6 rounded-xl max-w-lg w-full text-center">
                      <h3 className="text-base font-bold mb-2">1. Invia questo Token all'Affiliato</h3>
                      <textarea readOnly value={realOfferToken} className="w-full h-20 bg-[#181818] text-[10px] font-mono text-emerald-400 p-2 rounded border border-[#333] mb-2"></textarea>
                      <button onClick={() => copyToClipboard(realOfferToken, 'Token Host Copiato')} className="w-full bg-blue-600 py-2 rounded font-bold text-xs mb-4">Copia Token Host</button>
                      <h4 className="text-xs font-bold mb-2">2. Incolla il Token di Risposta ricevuto:</h4>
                      <textarea value={realAnswerToken} onChange={e => setRealAnswerToken(e.target.value)} className="w-full h-16 bg-[#181818] text-[10px] font-mono text-blue-300 p-2 rounded border border-[#333] mb-2"></textarea>
                      <button onClick={finalizeRealHosting} className="w-full bg-emerald-600 py-2 rounded font-bold text-xs">Conferma & Avvia Streaming</button>
                    </div>
                  )}
                  {!isRealConnected && webrtcRole === 'guest' && (
                    <div className="bg-[#252526] border border-[#444] p-6 rounded-xl max-w-lg w-full text-center">
                      <h3 className="text-base font-bold mb-2">Risposta Pronta! Inviala all'Host:</h3>
                      <textarea readOnly value={realAnswerToken} className="w-full h-24 bg-[#181818] text-[10px] font-mono text-blue-300 p-2 rounded border border-[#333] mb-3"></textarea>
                      <button onClick={() => copyToClipboard(realAnswerToken, 'Risposta Copiata!')} className="w-full bg-emerald-600 py-2 rounded font-bold text-xs">Copia Risposta</button>
                    </div>
                  )}
                  {webrtcRole === 'guest' && <video ref={remoteVideoRef} autoPlay playsInline className={'w-full h-full object-contain ' + (!isRealConnected ? 'hidden' : '')} />}
                  {webrtcRole === 'host' && isRealConnected && <div className="text-center text-emerald-400 font-bold text-xl">🎥 Stai trasmettendo il tuo schermo in P2P!</div>}
                </div>
              ) : (
                <div className="flex-1 flex items-center justify-center p-8">
                  <div className="w-full max-w-3xl bg-[#1e222d] border border-[#343b4f] rounded-xl p-8 text-center">
                    <h2 className="text-xl font-bold text-white mb-2">Desktop Remoto Attivo — {activeSession?.alias}</h2>
                    <p className="text-xs text-slate-400">Attiva la Lavagna nella barra superiore per disegnare sullo schermo durante la spiegazione.</p>
                  </div>
                </div>
              )}

              <canvas ref={canvasRef} width={1600} height={900} onMouseDown={startDraw} onMouseMove={draw} onMouseUp={stopDraw} className={'absolute inset-0 w-full h-full z-30 ' + (isWhiteboardMode ? 'cursor-crosshair pointer-events-auto' : 'pointer-events-none')} />

              {sidePanel === 'chat' && (
                <div className="absolute right-0 top-0 bottom-0 w-80 bg-[#252526] border-l border-[#444] flex flex-col z-40">
                  <div className="p-3 bg-[#1e1e1e] font-bold text-xs border-b border-[#333] flex justify-between">
                    <span>Chat Diretta</span>
                    <button onClick={() => setSidePanel(null)}>✕</button>
                  </div>
                  <div className="flex-1 p-3 overflow-y-auto space-y-2">
                    {chatMessages.map((m, i) => (
                      <div key={i} className="p-2 rounded bg-[#1e1e1e] text-xs">
                        <span className="font-bold text-blue-400">{m.sender}: </span>{m.text}
                      </div>
                    ))}
                  </div>
                  <form onSubmit={sendChatMessage} className="p-2 border-t border-[#333] flex gap-1">
                    <input value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Scrivi..." className="flex-1 bg-[#1e1e1e] px-2 py-1.5 rounded text-xs text-white" />
                    <button type="submit" className="bg-blue-600 px-3 py-1.5 rounded text-xs font-bold">Invia</button>
                  </form>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  <\/script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  <\/script>
</body>
</html>
